name: Python app checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check worker.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py
      - name: Start app and test health endpoint
        run: |
          python app.py > /tmp/mnemos.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mnemos.log
          exit 1
